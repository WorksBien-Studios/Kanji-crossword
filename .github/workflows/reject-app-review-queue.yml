name: Reject non-gym App Store reviews

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reject:
    runs-on: ubuntu-latest
    steps:
      - name: Reject active App Review submissions except gym
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          GYM_APP_ID: "6816462266"
        run: |
          ruby <<'RUBY'
          require 'base64'
          require 'json'
          require 'net/http'
          require 'openssl'
          require 'time'
          require 'uri'

          issuer_id = ENV.fetch('ASC_ISSUER_ID')
          gym_app_id = ENV.fetch('GYM_APP_ID')
          private_key_text = ENV.fetch('ASC_PRIVATE_KEY').gsub('\\n', [10].pack('C'))

          def b64url(value)
            Base64.urlsafe_encode64(value).delete('=')
          end

          def es256_signature(key, signing_input)
            der = key.sign('SHA256', signing_input)
            sequence = OpenSSL::ASN1.decode(der)
            zero = [0].pack('C')
            sequence.value.map { |integer| integer.value.to_s(2).rjust(32, zero)[-32, 32] }.join
          end

          now = Time.now.to_i
          header = { alg: 'ES256', kid: ENV.fetch('ASC_KEY_ID'), typ: 'JWT' }
          payload = { iss: issuer_id, iat: now, exp: now + 1200, aud: 'appstoreconnect-v1' }
          signing_input = [b64url(header.to_json), b64url(payload.to_json)].join('.')
          key = OpenSSL::PKey.read(private_key_text)
          token = [signing_input, b64url(es256_signature(key, signing_input))].join('.')

          def request(method, path, token, body = nil)
            uri = URI("https://api.appstoreconnect.apple.com#{path}")
            http = Net::HTTP.new(uri.host, uri.port)
            http.use_ssl = true
            klass = Net::HTTP.const_get(method)
            req = klass.new(uri)
            req['Authorization'] = "Bearer #{token}"
            req['Content-Type'] = 'application/json'
            req['Accept'] = 'application/json'
            req.body = body.to_json if body
            res = http.request(req)
            parsed = res.body && !res.body.empty? ? JSON.parse(res.body) : nil rescue res.body
            unless res.code.to_i.between?(200, 299)
              warn "#{method} #{path} failed HTTP #{res.code}: #{res.body}"
              exit 1
            end
            parsed
          end

          def get_all(path, token)
            out = []
            next_path = path
            while next_path
              data = request('Get', next_path, token)
              out.concat(data.fetch('data', []))
              link = data.dig('links', 'next')
              next_path = link ? URI(link).request_uri : nil
            end
            out
          end

          def review_submission_path(app_id, states)
            query = URI.encode_www_form({
              'filter[app]' => app_id,
              'filter[platform]' => 'IOS',
              'filter[state]' => states.join(','),
              'limit' => '50'
            })
            "/v1/reviewSubmissions?#{query}"
          end

          active_states = %w[WAITING_FOR_REVIEW IN_REVIEW]
          apps = get_all('/v1/apps?limit=200', token)
          puts "Found #{apps.length} apps in account. Gym app #{gym_app_id} will be kept in review."

          canceled = []
          kept = []
          skipped = []

          apps.each do |app|
            app_id = app.fetch('id')
            name = app.dig('attributes', 'name') || app_id
            if app_id == gym_app_id
              kept << name
              next
            end

            submissions = get_all(review_submission_path(app_id, active_states), token)
            if submissions.empty?
              skipped << "#{name}: no active iOS review submission"
              next
            end

            submissions.each do |submission|
              submission_id = submission.fetch('id')
              state = submission.dig('attributes', 'state')
              body = {
                data: {
                  type: 'reviewSubmissions',
                  id: submission_id,
                  attributes: { canceled: true }
                }
              }
              puts "Canceling #{name} app=#{app_id} reviewSubmission=#{submission_id} state=#{state}"
              updated = request('Patch', "/v1/reviewSubmissions/#{submission_id}", token, body)
              new_state = updated.dig('data', 'attributes', 'state') || 'updated'
              canceled << "#{name} (#{state} -> #{new_state})"
            end
          end

          puts "Kept gym app(s): #{kept.join(', ')}"
          puts "Canceled submissions: #{canceled.empty? ? 'none' : canceled.join(' | ')}"
          puts "Skipped: #{skipped.empty? ? 'none' : skipped.join(' | ')}"
          RUBY
