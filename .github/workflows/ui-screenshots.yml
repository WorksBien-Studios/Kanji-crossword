name: UI screenshots

# Renders the real SwiftUI screens on iPhone, iPad mini (one column) and
# iPad 11-inch (two column) simulators, then commits the PNGs to
# docs/ui-screenshots on the branch that was dispatched.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shoot:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: iphone
            simulator: 'iPhone 16'
            landscape: '0'
          - label: ipad-one-column
            simulator: 'iPad mini'
            landscape: '0'
          - label: ipad-two-column
            simulator: 'iPad Air 11-inch'
            landscape: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E 'iPhone 16 |iPad mini|iPad Air 11|iPad Pro 11' || true
      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "${{ matrix.simulator }}" | grep -Eo '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | head -1)
          test -n "$UDID" || { echo "No simulator matching ${{ matrix.simulator }}"; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
      - name: Render screens
        working-directory: ui
        env:
          TEST_RUNNER_KANJI_SCREENSHOTS: '1'
          TEST_RUNNER_KANJI_SHOT_DEVICE: ${{ matrix.label }}
          TEST_RUNNER_KANJI_LANDSCAPE: ${{ matrix.landscape }}
        run: |
          xcodebuild -scheme KanjiCrosswordUI -destination "id=${{ steps.sim.outputs.udid }}" \
            test -only-testing:KanjiCrosswordUITests/ScreenshotTests CODE_SIGNING_ALLOWED=NO
      - name: List output
        run: ls -la /tmp/kanji-shots
      - uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.label }}
          path: /tmp/kanji-shots/*.png
          if-no-files-found: error

  publish:
    needs: shoot
    if: ${{ always() && needs.shoot.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: shots-*
          merge-multiple: true
          path: docs/ui-screenshots
      - name: Commit screenshots
        run: |
          ls -la docs/ui-screenshots || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ui-screenshots
          git diff --cached --quiet && { echo "No screenshot changes"; exit 0; }
          git commit -m "Add rendered UI screenshots"
          git push
