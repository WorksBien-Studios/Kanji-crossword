name: Kanji Crossword App Store listing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    name: App Store lane identity must be reconciled
    runs-on: ubuntu-latest
    steps:
      - name: Stop before App Store Connect mutation
        run: |
          cat <<'MSG'
          This workflow is intentionally blocked.

          The repository release map and listing manifest currently disagree:
          - .github/testflight-app-map.json targets com.gooduse.kanjicrossword.jp / ASC app 6817887911
          - app-store/LISTING_MANIFEST.json targets com.gooduse.kanjicrossword / ASC app 6817388023

          Reconcile the App Store app ID, bundle ID, and IAP product contract before re-enabling metadata, screenshot, commerce, or review-submission automation.
          MSG
          exit 1
