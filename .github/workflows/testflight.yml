name: Kanji Crossword TestFlight

on:
  push:
    branches:
      - main
    paths:
      - ".github/testflight-dispatch.txt"
      - ".github/workflows/testflight.yml"
    tags:
      - "testflight-v*"
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  testflight:
    uses: WorksBien-Studios/.github/.github/workflows/ios-testflight.yml@main
    with:
      validated_sha: 24d5d10115a15d174cf76107bc57c639b648b0bb
      prepare_script: scripts/generate_app_icons.sh
      minimum_build_number: 6
    secrets:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
