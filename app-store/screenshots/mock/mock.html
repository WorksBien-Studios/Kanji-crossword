<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=440">
<title>Kanji Crossword screenshot mock</title>
<!--
  Mock of the SwiftUI play/results screens, generated from the real bundled puzzle
  (puzzle.js = content/puzzles-v2.json[227]) and the tokens in
  ui/Sources/KanjiCrosswordUI/Theme.swift, PlayLayout.swift, GameView.swift,
  GameBoardView.swift, AnswerTrayView.swift and ResultsView.swift.
  Open with ?s=1, ?s=2 or ?s=3.  Rendered by render.mjs at 440x956 @3x = 1320x2868.
-->
<link rel="stylesheet" href="fonts.css">
<script src="puzzle.js"></script>
<style>
:root{
  --canvas:#F5F6F3; --card:#FFFFFF; --fill:#EDF0F2; --bar:#FAFBF9; --ink:#161D2B;
  --ink2:#48546A; --line:#C6CDD5; --accent:#1F4B7A; --accentText:#1F4B7A;
  --mark:#F7D75A; --related:#DCE8F6; --starter:#E3E7EB; --stamp:#B93A22;
  --stampTint:#F8E1DB; --success:#2A7350; --successTint:#DDEFE5;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden;background:var(--canvas);
  font-family:-apple-system,"SF Pro Text","Noto Sans JP",sans-serif;color:var(--ink);
  -webkit-font-smoothing:antialiased}
.serif{font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;font-weight:700}
#app{background:var(--canvas)}
svg{display:block}

/* status bar / nav bar / home indicator */
.status{position:absolute;top:0;left:0;right:0;height:59px;display:flex;justify-content:space-between;
  align-items:center;padding:8px 34px 0 46px;font-weight:600;font-size:17px;z-index:5}
.status.pad{height:24px;padding:4px 30px 0 30px;font-size:15px}
.status .r{display:flex;gap:6px;align-items:center}
.home{position:absolute;bottom:8px;left:50%;margin-left:-70px;width:140px;height:5px;border-radius:3px;background:#000;z-index:20}
.nav{position:absolute;top:59px;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:600;background:var(--canvas)}
.nav .t{position:absolute;left:0;right:0;text-align:center}
.nav .trail{position:absolute;right:16px;display:flex;gap:14px;align-items:center;color:var(--accentText);font-weight:700;font-size:17px}
.nav .back{position:absolute;left:12px;color:var(--accentText);display:flex;align-items:center;font-weight:400}

/* play layout: strip / board / bottom panel */
.strip{position:absolute;top:103px;left:0;right:0;height:56px;padding:6px 16px;display:flex;align-items:center;gap:10px}
.strip .lab{font-size:13px;font-weight:700;color:var(--ink2);line-height:16px;white-space:nowrap;align-self:flex-start;padding-top:9px}
.chips{display:flex;gap:8px}
.chip{display:flex;gap:2px;padding:3px;background:var(--fill);border-radius:10px}
.slot{width:30px;height:36px;border-radius:6px;background:var(--card);border:1.5px solid var(--line);
  font-size:19px;display:flex;align-items:center;justify-content:center}
.slot.sel{background:var(--mark);border:3px solid var(--accent)}
.banner{margin:0 12px;flex:1;display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:14px;
  background:var(--successTint);font-size:15px;min-height:44px}

.board{position:absolute;left:0;right:0;display:grid;justify-content:center;align-content:center}
.cell{position:relative;border-radius:7px;border:1.5px solid var(--line);background:var(--card)}
.cell .n{position:absolute;left:5px;top:3px;font-weight:700;color:var(--ink2);line-height:1}
.cell .k{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.cell.starter{background:var(--starter)}
.cell.related{background:var(--related)}
.cell.selected{background:var(--mark);border:4px solid var(--accent)}
.cell.solved{background:var(--successTint);border-color:var(--success)}

.bottom{position:absolute;left:0;right:0;bottom:0;background:var(--bar);padding-top:4px;padding-bottom:var(--binset)}
.actions{display:grid;grid-template-columns:repeat(5,1fr);padding:0 8px}
.act{height:var(--act);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--accentText);font-size:13px;font-weight:700}
.act.off{opacity:.4}
.tray{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:8px;padding:8px 16px}
.tile{height:var(--tile);border-radius:12px;background:var(--card);border:2px solid var(--ink2);font-size:calc(var(--tile)*.52);
  display:flex;align-items:center;justify-content:center;color:var(--ink)}
.tile.used{border-style:dashed;opacity:.45}
.tile.off{opacity:.35}

.comp{padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.btn{width:100%;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:700}
.btn.p{background:var(--accent);color:#fff;height:56px;font-size:20px}
.btn.s{background:var(--card);border:2px solid var(--accent);color:var(--accentText);height:48px;font-size:17px}
.link{height:44px;display:flex;align-items:center;font-size:17px;font-weight:700;color:var(--accentText)}

/* results sheet */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.34);z-index:8}
.sheet{position:absolute;left:0;right:0;top:64px;bottom:0;background:var(--canvas);border-radius:38px 38px 0 0;
  z-index:9;overflow:hidden}
.sheet .nav{top:0;height:56px;background:transparent}
.sheet .trail{right:20px}
.res{position:absolute;top:56px;left:0;right:0;padding:16px;display:flex;flex-direction:column;gap:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat .a{font-size:15px;color:var(--ink2)}
.stat .b{font-size:22px;font-weight:700;margin-top:2px}
.saved{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--ink2)}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.mini{display:grid;gap:2px;width:max-content}
.mc{width:26px;height:26px;border-radius:4px;background:var(--successTint);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ink)}
.mc.hl{background:var(--mark);border:2px solid var(--ink)}
.mc.e{background:none;border:none}
.word44{font-size:44px;font-weight:900;line-height:1.15}
.read{font-size:20px;font-weight:700;color:var(--accentText)}
.hint{font-size:13px;color:var(--ink2)}
.sec{font-size:15px;font-weight:700;color:var(--ink2);margin-bottom:8px}
.words{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.w{height:56px;border-radius:14px;background:var(--card);border:1px solid var(--line);padding:0 12px;
  display:flex;align-items:center;justify-content:space-between}
.w b{font-size:22px;font-weight:900}
.w span{font-size:13px;color:var(--ink2)}
.w.sel{background:var(--mark);border:3px solid var(--accent)}

/* store composition */
body,html{width:auto;height:auto}
#stage{position:relative;overflow:hidden;background:linear-gradient(180deg,#FBF7EA 0%,#EAF0F7 100%)}
#stage:before{content:"";position:absolute;right:-90px;top:-90px;width:300px;height:300px;border-radius:50%;
  border:14px solid rgba(185,58,34,.16);box-shadow:inset 0 0 0 10px rgba(185,58,34,.10)}
.cap{position:absolute;left:0;right:0;text-align:center;font-weight:700;color:var(--ink);letter-spacing:.02em;line-height:1.28}
.cap mark{background:linear-gradient(transparent 58%,var(--mark) 58%);color:inherit;padding:0 .08em}
#dev{position:absolute;background:#0e1116;transform-origin:top left;box-shadow:0 30px 60px rgba(22,29,43,.35)}
#app{border-radius:inherit;overflow:hidden}
.tabs{position:absolute;left:50%;transform:translateX(-50%);top:30px;display:flex;background:rgba(237,240,242,.95);
  border-radius:26px;padding:4px;gap:2px;z-index:6;font-size:17px;font-weight:600}
.tabs span{padding:10px 26px;border-radius:22px;color:var(--ink2);display:flex;gap:8px;align-items:center}
.tabs span.on{background:#fff;color:var(--accentText);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.sheet.pad{left:166px;right:166px;top:250px;bottom:auto;border-radius:26px;padding-top:56px}
.sheet.pad .res{position:relative;top:0}
.sheet.pad .nav{position:absolute;top:0;left:0;right:0}
.sheet.pad .stats{grid-template-columns:repeat(5,1fr)}
.sheet.pad .words{grid-template-columns:repeat(4,1fr)}
.sheet.pad .hrow{display:flex;gap:18px;align-items:center}
</style>
</head>
<body>
<div id="stage"><div class="cap" id="cap"></div><div id="dev"><div id="app"></div></div></div>
<script>
const P = window.PUZZLE;
const qs = new URLSearchParams(location.search);
const q = qs.get('s') || '1';
const PAD = qs.get('d') === 'ipad';
/* device config: iPhone 6.9" = 440x956pt @3x, iPad 13" = 1032x1376pt @2x (PlayLayout.make rules) */
const D = PAD
  ? {W:1032,H:1376,status:24,nav:50,top:0,bottomInset:20,cols:8,tile:64,act:72,pad:10,bezel:16,radius:40,capFont:58,capTop:64,avail:1090,capW:1032}
  : {W:440,H:956,status:59,nav:44,top:0,bottomInset:34,cols:6,tile:50,act:60,pad:6,bezel:12,radius:56,capFont:31,capTop:34,avail:770,capW:440};
const STAGE = {w:D.W, h:D.H};
const sol = P.solution, starters = P.starterCells;
const numAt = {}; // "r,c" -> n
for (const [k,v] of Object.entries(P.cellNumbers)) numAt[k]=v;
const wordsOf = n => P.wordSpans.filter(w => w.cells.some(c => numAt[c]===n));
const numsOf = w => w.cells.map(c => numAt[c]);

/* ---- scenarios (numbers -> entered kanji) ---- */
const S = {
  // 1: 広告なし。大きな文字でじっくり。  Mid-game, 10 selected, thinking about 東京 / 帰京.
  1: { selected: 10, entries: {...starters, 1:'秩', 2:'序', 4:'面', 8:'方', 9:'東'}, status:'active' },
  // 2: タップだけで、同じ番号をまとめて入力。  Number 4 appears in two squares; one tap on 面 fills both.
  2: { selected: 4, entries: {...starters, 1:'秩', 2:'序', 4:'面'}, status:'active' },
  // 3: 完成盤も熟語も、あとからゆっくり確認。  Finished board, results sheet with a word review.
  3: { selected: null, entries: {...sol}, status:'completed', word: '壁面' },
}[q];

/* ---- helpers ---- */
const icon = {
  undo:'<svg width="24" height="22" viewBox="0 0 24 22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4 3.5 8.5 8 13"/><path d="M4 8.5h10a6 6 0 0 1 0 12h-4"/></svg>',
  redo:'<svg width="24" height="22" viewBox="0 0 24 22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4l4.500 4.500L16 13"/><path d="M20 8.500H10a6 6 0 0 0 0 12h4"/></svg>',
  hint:'<svg width="24" height="22" viewBox="0 0 24 22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17h6M10 20h4"/><path d="M12 2a6.500 6.500 0 0 0-3.600 11.900c.7.5 1.100 1.200 1.100 2.100h4.200c0-.9.4-1.600 1.100-2.100A6.500 6.500 0 0 0 12 2z"/></svg>',
  check:'<svg width="24" height="22" viewBox="0 0 24 22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="11" r="9"/><path d="m7.500 11.500 3 3 6-6.500"/></svg>',
  del:'<svg width="26" height="22" viewBox="0 0 26 22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h13a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H9L2.500 11z"/><path d="m12.500 7.500 7 7M19.500 7.500l-7 7"/></svg>',
  more:'<svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2"><circle cx="13" cy="13" r="11"/><circle cx="8" cy="13" r="1.300" fill="currentColor" stroke="none"/><circle cx="13" cy="13" r="1.300" fill="currentColor" stroke="none"/><circle cx="18" cy="13" r="1.300" fill="currentColor" stroke="none"/></svg>',
  ok:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="11" fill="#2A7350"/><path d="m6.800 12.300 3.700 3.700 6.800-7.500" stroke="#fff" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  okline:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m7.500 12.500 3 3 6-6.500" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  chev:'<svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>',
};
const statusBar = () => `<div class="status ${PAD?"pad":""}"><span>9:41</span><span class="r">
  <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx=".8"/><rect x="5" y="5.500" width="3" height="6.500" rx=".8"/><rect x="10" y="3" width="3" height="9" rx=".8"/><rect x="15" y="0" width="3" height="12" rx=".8"/></svg>
  <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"><path d="M1.500 4.200a10 10 0 0 1 14 0M4 7a6.500 6.500 0 0 1 9 0"/><circle cx="8.500" cy="10" r="1.300" fill="#000" stroke="none"/></svg>
  <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.500" fill="none" stroke="#000" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.300"/><rect x="25" y="4.500" width="1.800" height="4" rx=".9" opacity=".4"/></svg>
  </span></div>`;

/* ---- board (fit rules from BoardFit: spacing 2, padding 6 on iPhone) ---- */
function boardHTML(top, height) {
  const pad = D.pad, sp = 2;
  const size = Math.min(84, Math.max(40, Math.min((D.W-2*pad-sp*(P.columns-1))/P.columns, (height-2*pad-sp*(P.rows-1))/P.rows)));
  const related = new Set();
  if (S.selected) for (const w of wordsOf(S.selected)) numsOf(w).forEach(n => related.add(n));
  if (S.selected) related.delete(S.selected);
  let cells = '';
  for (let r=0;r<P.rows;r++) for (let c=0;c<P.columns;c++) {
    const n = numAt[`${r},${c}`];
    if (!n) { cells += `<div style="width:${size}px;height:${size}px"></div>`; continue; }
    let cls = 'cell';
    if (S.status==='completed') cls += ' solved';
    else if (S.selected===n) cls += ' selected';
    else if (related.has(n)) cls += ' related';
    else if (starters[n]) cls += ' starter';
    const e = S.entries[n];
    cells += `<div class="${cls}" style="width:${size}px;height:${size}px">
      <span class="n" style="font-size:${Math.max(11,size*0.26)}px">${n}</span>
      ${e?`<span class="k serif" style="font-size:${size*0.6}px;padding:${size*0.14}px 0 0 ${size*0.08}px">${e}</span>`:''}</div>`;
  }
  return `<div class="board" style="top:${top}px;height:${height}px;padding:${pad}px;grid-template-columns:repeat(${P.columns},${size}px);gap:${sp}px">${cells}</div>`;
}

const chip = span => `<div class="chip">${numsOf(span).map(n =>
  `<div class="slot serif ${n===S.selected?'sel':''}">${S.entries[n]||''}</div>`).join('')}</div>`;

function playScreen() {
  const active = S.status==='active';
  const used = new Set(Object.values(S.entries));
  const canErase = active && S.selected && !starters[S.selected] && S.entries[S.selected];
  let strip;
  if (!active) strip = `<div class="banner">${icon.ok}<span>完成しました。盤面はこのまま見られます。</span></div>`;
  else strip = `<div class="lab">番号 ${S.selected}<br>${wordsOf(S.selected).length}語</div><div class="chips">${wordsOf(S.selected).map(chip).join('')}</div>`;

  let bottom;
  if (active) {
    const act = (i,t,off) => `<div class="act ${off?'off':''}">${icon[i]}<span>${t}</span></div>`;
    bottom = `<div class="bottom"><div class="actions">
      ${act('undo','元に戻す',false)}${act('redo','やり直す',true)}${act('hint','ヒント',false)}${act('check','確認',false)}${act('del','消す',!canErase)}</div>
      <div class="tray">${P.traySeed.map(k=>`<div class="tile serif ${used.has(k)?'used':''}">${k}</div>`).join('')}</div></div>`;
  } else {
    bottom = `<div class="bottom" style="padding-top:0"><div class="comp">
      <div class="btn p">結果を見る</div>
      <div style="display:flex;gap:10px;width:100%"><div class="btn s">完成盤を見る</div><div class="btn s">次の問題</div></div>
      <div class="link">問題一覧へ</div></div></div>`;
  }
  const rows = Math.ceil(P.traySeed.length/D.cols);
  const bottomH = active ? 4+D.act+(rows*D.tile+(rows-1)*8+16)+D.bottomInset
                         : 16+56+10+48+10+44+16+D.bottomInset;
  const navTop = PAD ? D.status+58 : D.status;
  const stripTop = navTop+D.nav;
  const boardTop = stripTop+56, boardH = D.H - boardTop - bottomH;
  const tabs = PAD ? `<div class="tabs"><span class="on">遊ぶ</span><span>記録</span><span>設定</span></div>` : '';
  return `${statusBar()}${tabs}
    <div class="nav" style="top:${navTop}px"><div class="back">${icon.chev}</div><div class="t">${{easy:'やさしい'}[P.difficulty]}</div>
      <div class="trail">${active?'<span>休む</span>':''}${icon.more}</div></div>
    <div class="strip" style="top:${stripTop}px">${strip}</div>${boardHTML(boardTop, boardH)}${bottom}<div class="home"></div>`;
}

function resultsSheet() {
  const span = P.wordSpans.find(w => w.word===S.word);
  const hl = new Set(span.cells);
  let mini = '';
  for (let r=0;r<P.rows;r++) for (let c=0;c<P.columns;c++) {
    const n = numAt[`${r},${c}`];
    mini += n ? `<div class="mc serif ${hl.has(`${r},${c}`)?'hl':''}">${sol[n]}</div>` : `<div class="mc e"></div>`;
  }
  const stat = (a,b) => `<div class="stat"><div class="a">${a}</div><div class="b">${b}</div></div>`;
  return `<div class="scrim"></div><div class="sheet ${PAD?'pad':''}">
    <div class="nav"><div class="t">結果</div><div class="trail"><span>閉じる</span></div></div>
    <div class="res">
      <div class="stats">${stat('時間','0:07:18')}${stat('自己ベスト','0:07:18')}${stat('修正','1回')}${stat('ヒント','0回')}${stat('間違い確認','1回')}</div>
      <div class="saved">${icon.okline}<span>完成盤は「記録」に保存されました</span></div>
      <div class="kcard"><div class="${PAD?'hrow':''}">
        <div class="mini" style="grid-template-columns:repeat(${P.columns},26px)">${mini}</div>
        <div><div class="word44 serif">${span.word}</div><div class="read">${span.reading}</div>
        <div class="hint" style="margin-top:4px">タップした熟語のマスが黄色になります。</div></div>
      </div></div>
      <div><div class="sec">完成した熟語（${P.wordSpans.length}語）</div>
        <div class="words">${P.wordSpans.map(w=>`<div class="w ${w.word===S.word?'sel':''}"><b class="serif">${w.word}</b><span>${w.reading}</span></div>`).join('')}</div></div>
    </div></div>`;
}

const CAPS = {
  1: '広告なし。<br><mark>大きな文字</mark>でじっくり。',
  2: 'タップだけで、<br><mark>同じ番号</mark>をまとめて入力。',
  3: '完成盤も<mark>熟語</mark>も、<br>あとからゆっくり確認。',
};
const app = document.getElementById('app');
app.style.cssText = `position:relative;width:${D.W}px;height:${D.H}px;`;
app.style.setProperty('--cols', D.cols); app.style.setProperty('--tile', D.tile+'px');
app.style.setProperty('--act', D.act+'px'); app.style.setProperty('--binset', D.bottomInset+'px');
app.innerHTML = playScreen() + (S.status==='completed' ? resultsSheet() : '');
if (PAD) app.querySelector('.home').style.bottom = '7px';

const stage = document.getElementById('stage');
stage.style.cssText = `width:${D.W}px;height:${D.H}px`;
const cap = document.getElementById('cap');
cap.innerHTML = CAPS[q]; cap.style.cssText = `top:${D.capTop}px;font-size:${D.capFont}px`;
const dev = document.getElementById('dev');
const scale = D.avail / (D.H + 2*D.bezel);
dev.style.cssText = `width:${D.W+2*D.bezel}px;height:${D.H+2*D.bezel}px;padding:${D.bezel}px;border-radius:${D.radius+D.bezel}px;
  left:${(D.W - (D.W+2*D.bezel)*scale)/2}px;top:${D.H - D.avail - (PAD?44:28)}px;transform:scale(${scale})`;
app.style.borderRadius = D.radius+'px';
</script>
</body>
</html>
